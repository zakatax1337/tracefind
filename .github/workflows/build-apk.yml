name: Build TraceFind APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name '*.zip' \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "Project files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f | head -150

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name 'gradlew' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found!"
            echo ""
            echo "Searching for Gradle files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
                -name 'settings.gradle' \
                -o -name 'settings.gradle.kts' \
                -o -name 'build.gradle' \
                -o -name 'build.gradle.kts' \
              -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew found:"
          echo "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

         
