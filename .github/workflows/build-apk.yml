name: Build TraceFind APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -not -path '*/.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | head -200

      - name: Find Android/Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          SETTINGS="$(find "$ROOT" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          BUILD_FILE="$(find "$ROOT" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS" ] && [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle project was not found in the ZIP."
            echo "Gradle files found:"
            find "$ROOT" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
            exit 1
          fi

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          mkdir -p "$HOME/.gradle"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
          else
            echo "No gradlew found; using installed Gradle 8.9."
          fi

          if [ -f "gradle.properties" ]; then
            grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
            grep -q '^android.enableJetifier=' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          else
            printf '%s\n'               'android.useAndroidX=true'               'android.enableJetifier=true'               'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'               > gradle.properties
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TraceFind-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
