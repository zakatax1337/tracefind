name: Build TraceFind APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -oq TraceFind-v1-GitHub-Actions.zip
          echo "Project extracted:"
          find . -maxdepth 3 -type f -name "settings.gradle.kts"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: UsernameOSINT
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TraceFind-APK
          path: UsernameOSINT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
